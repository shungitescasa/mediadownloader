<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{.PageTitle}}</title>
        <meta name="description" content="{{.Description}}" />
        {{template "meta" .}}
        <link rel="stylesheet" href="/static/style.css" />
        <link
            rel="shortcut icon"
            href="/static/favicon.ico"
            type="image/x-icon"
        />
    </head>
    <body>
        {{template "header" .}}
        <main>
            <form id="form">
                <input
                    id="url"
                    name="url"
                    type="url"
                    placeholder="paste link from X/Twitter, Instagram, YouTube or other site..."
                    required
                    autofocus
                    autocomplete="off"
                />
                <button type="submit">submit</button>
                <fieldset id="types">
                    <label>
                        <input type="radio" name="type" value="video" checked />
                        <img src="/static/img/icons/video.png" alt="" />
                        <span>video</span>
                    </label>
                    <label>
                        <input type="radio" name="type" value="audio" />
                        <img src="/static/img/icons/audio.png" alt="" />
                        <span>audio</span>
                    </label>
                    <label>
                        <input type="radio" name="type" value="meta" />
                        <img src="/static/img/icons/meta.png" alt="" />
                        <span>meta</span>
                    </label>
                </fieldset>
            </form>
            <p id="error"></p>
            <section id="queue"></section>
        </main>
        {{template "footer" .}}
    </body>

    <script src="/static/app.js"></script>
</html>
