<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{.Title}}</title>
        <link rel="stylesheet" href="/static/style.css" />
        <link rel="favicon" href="/favicon.ico" />
    </head>
    <body>
        <header>
            <h1>
                <img
                    src="/static/img/brand/big.webp"
                    alt="{{.Title}}"
                    title="{{.Title}}"
                />
            </h1>
        </header>
        <main>
            <form id="form">
                <input
                    id="url"
                    name="url"
                    type="url"
                    placeholder="paste link from X/Twitter, Instagram, YouTube or other site..."
                    required
                    autofocus
                    autocomplete="off"
                />
                <button type="submit">submit</button>
                <fieldset id="types">
                    <label>
                        <input type="radio" name="type" value="video" checked />
                        <img src="/static/img/icons/video.png" alt="" />
                        <span>video</span>
                    </label>
                    <label>
                        <input type="radio" name="type" value="audio" />
                        <img src="/static/img/icons/audio.png" alt="" />
                        <span>audio</span>
                    </label>
                    <label>
                        <input type="radio" name="type" value="meta" />
                        <img src="/static/img/icons/meta.png" alt="" />
                        <span>meta</span>
                    </label>
                </fieldset>
            </form>
            <p id="error"></p>
            <section id="queue"></section>
        </main>
        <footer>
            {{if .Maintainer}}
            <p>
                maintained by {{if .MaintainerLink}}<a
                    href="{{.MaintainerLink}}"
                    target="_blank"
                    rel="noopener noreferrer"
                    >{{.Maintainer}}</a
                >{{else}}{{.Maintainer}}{{end}}
            </p>
            {{end}}
            <p>
                powered by
                <a
                    href="https://github.com/yt-dlp/yt-dlp"
                    target="_blank"
                    rel="noopener noreferrer"
                    >yt-dlp</a
                >
                {{.YtdlpVersion}} &middot;
                <a
                    href="https://github.com/yt-dlp/yt-dlp/blob/master/supportedsites.md"
                    target="_blank"
                    rel="noopener noreferrer"
                    >supported platforms</a
                >
                &middot;
                <a
                    href="https://github.com/shungitescasa/mediadownloader"
                    target="_blank"
                    rel="noopener noreferrer"
                    >source code</a
                >
            </p>
        </footer>
    </body>

    <script src="/static/app.js"></script>
</html>
